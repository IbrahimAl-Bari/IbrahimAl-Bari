<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-labelledby="title desc">
  <title id="title">Building thoughtful products, engineering reliable systems, currently learning Python</title>
  <desc id="desc">A typing-style line that reveals the introduction from left to right.</desc>
  <defs>
    <clipPath id="reveal">
      <rect x="150" y="8" width="0" height="58">
        <animate attributeName="width" values="0;900;900;0" keyTimes="0;0.62;0.86;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <text x="600" y="48" text-anchor="middle" fill="#669BBC" font-family="Satoshi, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing=".2" clip-path="url(#reveal)">Building thoughtful products · Engineering reliable systems · Learning Python</text>
  <rect x="150" y="18" width="2" height="34" rx="1" fill="#C1121F">
    <animate attributeName="x" values="150;1050;1050;150" keyTimes="0;0.62;0.86;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.62;0.86;0.99;1" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>